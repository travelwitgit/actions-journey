name: passingjob
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: package app
        run: echo "this is for testing" > app.txt
      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.txt
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download app
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: check it arrived
        run: test -f app.txt
